name: personal build

# personal-mods 自动构建发布（见 LOCAL-MODS.md）：
# - schedule：轮询官方 main，有新提交才 rebase + 构建 + 发 Release
# - push：personal-mods 有新提交（对话驱动改动）时构建发布
# - workflow_dispatch：手动触发
# 产物 = GitHub Release（zip/dmg + personal-update.json 发布清单），
# app 轮询 /releases/latest/download/personal-update.json 比对 buildId 点亮更新。

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [personal-mods]
    # 纯文档/流水线改动不值得烧 20 分钟 mac runner；只有业务代码变更才构建。
    # schedule 不受 paths 影响，仍由守卫步骤负责「官方没动就秒退」。
    paths:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"

permissions:
  contents: write

concurrency:
  group: personal-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    env:
      UPSTREAM_URL: https://github.com/zai-org/ZCode.git
      ZCODE_ENV: production
      ZCODE_PREVIEW_IDENTITY: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # macos-14 runner 只有 7GB 内存，Node 默认堆上限会让 tsc -b 全仓编译直接
      # SIGABRT（exit 134）；显式放大到接近机器上限
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-mods
          fetch-depth: 0

      - name: Guard - skip when nothing new
        id: guard
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL" || true
          git fetch upstream main
          git fetch origin main
          # 拉取历史 personal-* tag 作为构建序号的事实来源
          git fetch origin 'refs/tags/personal-*:refs/tags/personal-*' || true
          official_remote=$(git rev-parse upstream/main)
          official_base=$(git merge-base origin/main upstream/main)
          last_released=$(git rev-parse "$(git tag --list 'personal-*' --sort=-creatordate | head -1)" 2>/dev/null || echo none)
          head_hash=$(git rev-parse HEAD)
          # 官方没动（fork main 已含官方）且 HEAD 已发过 → 无事可做
          if [ "$official_base" = "$official_remote" ] && [ "$head_hash" = "$last_released" ]; then
            echo "nothing new: official unchanged and HEAD already released"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "official_base=$official_base official_remote=$official_remote head=$head_hash last_released=$last_released"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Sync - rebase personal-mods onto upstream main
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "personal-mods-ci"
          git config user.email "personal-mods-ci@users.noreply.github.com"
          # 维护本地 main 指向官方最新（write_build_metadata 用它做官方基线）
          git branch -f main upstream/main
          git rebase upstream/main
          # rebase 后回推远端分支，保证远端与已发布构建一一对应
          git push --force-with-lease=personal-mods origin personal-mods

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 10.33.2

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        # 已知 flake：macOS 上 esbuild postinstall 与 pnpm 临时目录 rename 竞态
        # （ERR_PNPM_ENOENT _tmp_... -> esbuild），失败重试一次即可命中缓存完成
        run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile

      - name: Validate
        if: steps.guard.outputs.skip != 'true'
        run: |
          pnpm typecheck
          pnpm lint
          pnpm architecture:check --changed

      - name: Build desktop app
        if: steps.guard.outputs.skip != 'true'
        run: |
          pnpm --filter @zcode/desktop build
          pnpm --filter @zcode/desktop bundle

      - name: Record build metadata
        if: steps.guard.outputs.skip != 'true'
        run: scripts/sync-personal-mods.sh --record

      # .personal-build-id 写入于 bundle 之后，dmg/zip 里天然没有它；补注进 zip
      # （自动化安装走 zip），否则装出的 app 无法参与构建号比对与防回退
      - name: Inject build id into zip
        if: steps.guard.outputs.skip != 'true'
        run: |
          cd packages/desktop/dist/mac-arm64
          zip_path=$(ls -t ZCode*.zip | head -1)
          zip "$zip_path" "ZCode Preview.app/.personal-build-id"

      - name: Publish GitHub Release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-personal-release.sh

  # Windows 安装包（NSIS x64，未签名）追加到 mac job 刚发布的同一个 Release。
  # needs 串行：mac job 负责 rebase + force-push + 发 Release，这里检出 rebase 后的
  # 同一 HEAD 构建，保证两个平台产物同源。产物仅供手动下载安装——app 内绿点与
  # --install-remote 自动更新是 macOS 专属（bash/ditto 安装器），不消费 win 资产。
  windows:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: windows-latest
    env:
      ZCODE_ENV: production
      ZCODE_PREVIEW_IDENTITY: "1"
      # 全仓 tsc -b 的堆需求与 mac 同源；windows-latest 内存充裕，给足余量
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-mods

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile

      # typecheck/lint 已由 mac job 对同一 HEAD 跑过，不重复烧时间
      - name: Build windows installer
        run: |
          pnpm --filter @zcode/desktop build
          pnpm bundle:desktop -- --os win --arch x64

      - name: Upload installer to Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          # 输出目录按架构隔离，不猜层级直接找；排除 blockmap
          exe=$(find packages/desktop/dist -name 'ZCode*win*.exe' ! -name '*.blockmap' | head -1)
          [ -n "$exe" ] || { echo "windows installer not found"; exit 1; }
          gh release upload "$tag" "$exe" --repo "$GITHUB_REPOSITORY" --clobber
